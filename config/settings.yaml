# Every tunable number in the system. CLAUDE.md: no magic numbers in service code.
# If you are about to write a literal into a service, it belongs here instead.
#
# Values marked UNRESOLVED depend on an open decision in SPEC §10. Do not silently
# pick one — flag it.

camera:
  id: cam01                      # constant today; the field exists so we never reindex

paths:
  archive: data/archive          # segment files, native resolution, never downscaled
  clips: data/clips              # evidence clips cut for actions and deep answers
  action_log: data/actions.jsonl # append-only, SPEC §6.4
  chat_log: data/chats.jsonl     # chat turns + job refs, SPEC §11.4

# --------------------------------------------------------------------------------------
# Retention — the "delete footage and captions older than N" sweep (the topbar button)
# --------------------------------------------------------------------------------------
# This is the one operation in the system that destroys evidence, and nothing undoes it:
# the archive is the ONLY thing the deep worker can re-read (invariant 7), so a swept
# hour is an hour that can never be re-analysed, only remembered through whatever caption
# survived. Hence a plan/apply split rather than a single call — the button shows what it
# is about to destroy, with real counts, before anything is unlinked.
#
# Disk is not the reason to use it. At ~22 GB/day measured (CLAUDE.md) against 3.3 TB
# free, the archive is not close to a problem; this exists so a rehearsal can be reset
# and a demo can start from a known-empty history.
retention:
  max_age_seconds: 10800         # 3 hours — what the button offers by default
  # A floor on what any request may ask for, whatever the caller says. The recent past is
  # where the live window, ingest's backlog and any in-flight deep job all live; a sweep
  # that reaches into it deletes the footage the next question is about.
  min_age_seconds: 900           # 15 minutes
  # Never unlink the file ffmpeg currently has open — that takes the recorder's mp4
  # finalisation with it, and a hard-killed segment is undecodable for every window
  # overlapping it (CLAUDE.md). The newest segment on disk is always kept, as is anything
  # modified within this many segment lengths of now.
  live_segment_guard_segments: 2
  # Evidence clips under `paths.clips` are deliberately NOT swept. They are what SPEC
  # §6.4's "why did you alert at 21:11?" renders from, the action log that references
  # them is append-only, and they are megabytes against the archive's gigabytes.

# --------------------------------------------------------------------------------------
# Importer — recorded video as a second way in (services/importer)
# --------------------------------------------------------------------------------------
# The live camera is not the only source the system should accept: a demo needs footage
# that can be CHOSEN rather than staged, and an open dataset clip has to be able to run
# through the same gate, the same captioner and the same index as the camera does.
#
# An import is not a second pipeline. The file is sliced into archive segments whose
# NAMES carry wall-clock time, which is the only thing M1..M5 use to place footage in
# time (shared/timecode.py), so everything downstream is unchanged and the burned overlay
# comes out right on its own.
importer:
  inbox: data/inbox              # drop a video here, then `python3 -m services.importer --inbox`
  manifest: data/imports.jsonl   # what was imported, from which file, at which range
  ffprobe_bin: ffprobe
  # Imports get their OWN camera id — clip01, clip02 — never `camera.id`. Two sources
  # sharing an id interleave on the timeline the moment their ranges overlap, and a
  # stitch across the seam would splice a recording into the live camera's footage.
  camera_id_prefix: clip
  extensions: [mp4, mov, mkv, avi, webm, m4v]
  poll_interval_seconds: 5.0     # --watch; a human dropping files, not a message bus

# --------------------------------------------------------------------------------------
# Recorder — SPEC §2.1
# --------------------------------------------------------------------------------------
recorder:
  ffmpeg_bin: ffmpeg             # installed 2026-08-15: 6.1.1, with cuda/nvdec/nvenc
  clip_timeout_seconds: 20.0     # a clip cut runs inside the action-log lock, so a hang
                                 # here blocks both M3 and M5. Bound it.
  segment_seconds: 60            # a 30 s fetch touches <=2 files; 1440 files/day
  filename_pattern: "{camera_id}_%Y%m%d_%H%M%S.mp4"
  container: mp4
  # The archive is what the deep worker re-reads. Never downscale it, never re-encode
  # it to save disk. CLAUDE.md invariant 7.
  copy_codec: true
  # SPEC §10 D2 — RESOLVED on gn100-2f74: a USB webcam, a **DJI Osmo Pocket 4** in webcam
  # mode (USB id 2ca3:0023), attached and verified 2026-08-16 02:53 UTC.
  #
  # A local device, deliberately: it cannot be taken out by a network. An `rtsp://` URL
  # or a file path still work here unchanged if a different source is ever wanted.
  source: /dev/video0
  device:
    # Capture MODE, not a downscale. Verified against the attached Osmo Pocket 4:
    #   ffmpeg -f v4l2 -list_formats all -i /dev/video0
    #   mjpeg: 1920x1080, 1080x1920, 3840x2160, 1728x3072   (no raw formats at all)
    #   HEVC is advertised but this ffmpeg build cannot take it over v4l2
    # `/dev/video1` exists and exposes no formats — it is the metadata node, not a
    # second camera. Point this at video0 or ffmpeg fails with an ioctl error.
    # 1080p matches SPEC §2.1's archive budget. 3840x2160 is offered and would give the
    # deep worker more detail to find, at ~4x the disk — revisit only if D1 lands early.
    # NOTE: 1280x720 is NOT supported by this camera; ffmpeg would silently substitute.
    video_size: 1920x1080
    framerate: 30
    # Mandatory here, not optional: this camera exposes no raw format, and the only
    # alternative it advertises is HEVC, which this ffmpeg build cannot take over v4l2.
    input_format: mjpeg
    # A webcam cannot be stream-copied into mp4, so this path encodes at capture
    # resolution. Invariant 7 forbids downscaling the archive, not encoding it.
    # h264_nvenc uses the dedicated encoder block, so it costs no SM time the VLM wants.
    # Verified working on this GB10. Fall back to libx264 if nvenc ever misbehaves.
    encoder: h264_nvenc
    encoder_args: []
    # Load-bearing, not a quality knob. A stream-copied clip can only START on a
    # keyframe, so this bounds how accurately an evidence clip (and the deep worker's
    # seek) can hit a requested time range. Measured on this box: an 8.3 s GOP turned a
    # 2.0 s request into 8.07 s of footage beginning 6 s early; 1 s returns 2.1 s.
    # Lower costs a little disk and buys temporal precision. Do not raise it.
    keyframe_interval_seconds: 1.0
  preview:
    # A rolling JPEG of what the camera sees right now, for the UI's live view.
    #
    # It is a SECOND OUTPUT of the recorder's own ffmpeg, not a second reader: v4l2 gives
    # exclusive access to /dev/video0, so nothing else can open the camera while the
    # recorder holds it. One input, two sinks.
    #
    # The tradeoff, stated plainly: this puts a non-archive output inside the process
    # SPEC §2.1 says must keep recording no matter what. If the JPEG write fails, ffmpeg
    # exits and the supervisor restarts it — a few seconds of archive gap for a cosmetic
    # feature. It writes to `paths` under the repo, which the recorder creates, so the
    # realistic failure is a full disk (which loses the archive anyway). Set
    # `enabled: false` if you want the archive path to carry zero extra risk.
    enabled: true
    path: data/live.jpg
    fps: 2                       # preview only; does not touch ingest.sample_fps
    width: 640                   # a downscale of the PREVIEW, never of the archive
    quality: 6                   # ffmpeg -q:v, 2 (best) .. 31
  rtsp_transport: tcp            # UDP drops frames silently; a hole in the archive is
                                 # indistinguishable from "nothing happened".
  realtime_file_playback: true   # a file source gets -re, so a recorded demo does not
                                 # write a day of wall-clock-named segments in a minute
  stop_timeout_seconds: 10.0     # SIGTERM, then SIGKILL. ffmpeg needs the grace period
                                 # to finalise the mp4 moov atom, or the segment is
                                 # unplayable — and unplayable footage is lost footage.
  restart:
    initial_backoff_seconds: 1.0
    max_backoff_seconds: 60.0
    backoff_multiplier: 2.0
    healthy_seconds: 30.0        # a run this long resets the backoff ladder
    max_consecutive_failures: 0  # 0 = never give up. The recorder outliving the
                                 # analysis stack is the entire point of §2.1.
    stall_timeout_seconds: 180.0 # alive but the archive stopped growing = dead to us
    poll_interval_seconds: 1.0
  max_drift_seconds: 2.0         # a "60 s" segment is never exactly 60 s. Larger than
                                 # any plausible segmenter overshoot, smaller than any
                                 # gap worth reporting. Beyond this, a jump between
                                 # consecutive filenames is a recorder restart (and so
                                 # a real hole), not one long file.

# --------------------------------------------------------------------------------------
# Ingest — SPEC §2.2 / §2.3 / §2.4
# --------------------------------------------------------------------------------------
ingest:
  # Task-aware captioning. The caption is the only substrate M5 detection has, so the
  # active standing tasks are appended to the caption prompt as an explicit checklist.
  # See services/ingest/watchlist.py. Set `enabled: false` to go back to a purely
  # general caption — Ask is unaffected either way, Watch gets markedly worse.
  watchlist:
    enabled: true
    # Written by whoever owns task CRUD (the agent server), polled by mtime here, because
    # M1 and M5 are separate processes and runtime task registrations live in neither's
    # config file. Falls back to `monitor.tasks_file` when absent, so a box that has
    # never opened the UI still gets a task-aware caption from the cold-start seed.
    path: data/watchlist.json
    # The prompt grows one line per task and prefill stops being free eventually. Tasks
    # past this cap steer no captions at all, so the truncation is logged loudly rather
    # than applied quietly.
    max_items: 8

  window_seconds: 5              # latency floor is "wait for the window to close"
  # The real-time budget in one number: ingest must finish a window in less than a
  # stride, or it falls behind the camera and never catches up.
  #
  # Left at 4 on 2026-08-16 after trying 6. `IngestSettings.validate` refuses a stride
  # longer than the window, and it is right to: 6 s of stride against a 5 s window
  # leaves a 1 s hole that no analysis window covers and that nothing in the index would
  # show. Widening the stride means widening the window with it, which changes what a
  # caption describes — a real decision, not a knob to turn while chasing a lag. The
  # cheaper dial was the token cap above.
  stride_seconds: 4
  # -> 3 frames per window (was 1 fps / 5 frames). The caption prompt is dominated by
  # IMAGE tokens, not text: 5 frames at 512px measured 4181 prompt tokens on this model,
  # so two fewer frames is roughly a third off every captioned window's prefill. Measured
  # 2026-08-16 while ingest was 82 s behind the camera and losing ground at 0.70x real
  # time; the gate could not help because a room with people in it has motion in nearly
  # every window (38% skipped, against the ~78% these budgets assume).
  #
  # What it costs: a 5 s window sampled at 0.6 fps is a frame every ~1.7 s, so a gesture
  # that starts and finishes between two frames is not described. That is the honest
  # trade — SPEC §2.4 already treats the caption as lossy on purpose, and the deep worker
  # re-watches at 4 fps when a question needs what the caption dropped.
  sample_fps: 0.6
  # KV-cache pressure dial (SPEC §2.5) — and, at these frame counts, a prefill dial too:
  # image tokens scale with AREA, so 512 -> 384 is 44% fewer of them per frame. Lowered
  # 2026-08-16 as the last step of getting ingest back to real time; the overlay is still
  # burned after the resize and stays legible at this size (invariant 8), which is the
  # constraint that actually bounds this number.
  live_short_side_px: 384

  overlay:
    # Burned AFTER the resize. The VLM reads it for temporal localization; if it goes
    # illegible, localization fails silently. CLAUDE.md invariant 8.
    enabled: true
    format: "%Y-%m-%d %H:%M:%S UTC"
    position: bottom
    min_height_px: 16            # below this the overlay stops surviving downscale
    fontfile: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf   # verified present
    fontsize: 20
    padding_px: 8
    # White-on-black-box is the only combination that survives both a bright and a dark
    # scene, which is why it is not left to taste.
    fontcolor: white
    box_opacity: 0.6
    # The overlay is grown until it clears min_height_px after the downscale; this caps
    # that search so an absurd config cannot eat the frame it is annotating.
    max_fontsize: 64
    # See SPEC §10 D8 — the overlay is UTC while the UI renders local. It is drawn onto
    # the SAMPLED FRAMES the model reads, never into the archive, so changing it is a
    # config change rather than a re-shoot.

  # null = use recorder.ffmpeg_bin, so a CUDA build in /opt is configured once, not twice
  ffmpeg_bin: null
  # Ceiling on any single ffmpeg call. A window is 5 s of footage and decode is a few
  # hundred ms; 30 s means "the subprocess is wedged", not "it is busy". Unbounded is not
  # an option: ingest is a loop and one hung decode stops all of it.
  ffmpeg_timeout_seconds: 30.0
  # ffmpeg's mjpeg -q:v, 2 (best) to 31. Frames are base64'd into the request body, so
  # this is a prefill-BYTES dial, not a latency one (prefill is ~5% of chunk cost). 3
  # keeps the burned clock crisp — the one thing that must survive compression (inv. 8).
  frame_jpeg_quality: 3
  # null = derive from vlm.profiles.live.request_timeout_seconds plus the queue's pause
  # cap, i.e. the longest a well-behaved ingest job can legitimately take (SPEC §7).
  caption_timeout_seconds: null
  poll_interval_seconds: 1.0     # well under the 4 s stride, so the tail is never the
                                 # latency floor

  bench:
    # SPEC §9 block 0. If a single 5-frame caption exceeds this, D1 is forced to the
    # smaller Cosmos variant — that is the decision this number exists to trigger.
    target_caption_seconds: 4.0

  gate:
    # Frames per second the GATE samples at — not ingest.sample_fps, which is what the
    # VLM sees. Two per second over a 5 s window is 10 thumbnails at 1 KB each: enough
    # pairs that a half-second movement lands between two, cheap enough that the gate
    # stays the ~0.1 s line item SPEC §8 budgets for it.
    sample_fps: 2
    # SPEC §2.3 — the main reason real-time is achievable.
    enabled: true
    target_skip_rate: 0.80       # aim: >=80% of windows never reach the VLM
    warn_skip_rate: 0.60         # below this the gate is mistuned and real-time is gone
    # Mean absolute inter-frame delta, 0..1. Raised 0.02 -> 0.05 on 2026-08-16, from the
    # measured distribution rather than by feel. Over 44 judged windows of this room:
    #
    #   p25 0.0036   p50 0.0237   p60 0.0332   p70 0.0692   p75 0.1062   p90 0.1748
    #
    #   threshold  0.02 -> 48% skipped    0.04 -> 64%
    #              0.03 -> 57%            0.05 -> 68%     0.06 -> 68%
    #
    # 0.04-0.06 all land on 68% because the scores JUMP there: below ~0.05 is a room
    # settling — a chair, a hand, compression noise — and real events (someone entering,
    # walking past, waving) score 0.1 and up. Cutting in that gap buys 20 points of skip
    # rate without touching anything the demo is about.
    #
    # This is the number CLAUDE.md means by "prefer deleting work over parallelizing it":
    # at ~9 s a caption on a busy scene, 48% skipped is 0.80x real time and a lag that
    # grows forever, while 68% is comfortably inside the 4 s stride. Watch it in the
    # ingest summary — `skip_rate` under warn_skip_rate means the gate has stopped
    # earning its place and real time is gone.
    #
    # 0.05 -> 0.08 on the same evening, for a different reason than the first raise. At
    # 0.05 ingest held 0.94x real time: stable while idle, but every ask-surface
    # escalation takes the single VLM slot for 15-30 s and that lag never came back.
    # Holding is not enough — ingest has to run FASTER than real time when nothing is
    # asking, so a question costs a spike instead of a permanent debt. p75 of the
    # measured distribution is 0.106 and real events score 0.1+, so this still sits
    # below anything the demo is about.
    motion_threshold: 0.08
    min_object_confidence: 0.40
    # DeepStream is absent and its sm_121 support unverified, so `motion` ships first:
    # ffmpeg downscales to a tiny grayscale thumbnail (C speed) and the diff is computed
    # over ~1 KB/frame in pure Python — no numpy, no OpenCV, no new dependency.
    backend: motion              # motion | deepstream | tensorrt
    thumbnail_size: 32           # 32x32 gray = 1024 bytes/frame
    warmup_windows: 2            # never gate away the first windows; there is no
                                 # reference frame yet and a false skip is invisible

# --------------------------------------------------------------------------------------
# VLM — one process, two profiles. CLAUDE.md invariants 1 and 6.
# --------------------------------------------------------------------------------------
vlm:
  # `stub` returns deterministic synthetic captions so the pipeline can run before a
  # model is serving. It is NOT a test mock. Now resolved — a real model is serving.
  backend: vllm                  # stub | vllm
  # gn100-2f74: the box's own provisioning serves this model via vLLM (systemd unit
  # `gn100-vlm.service`, NGC vLLM container). We start no model process — invariant 1.
  endpoint: http://localhost:8082/v1
  # SPEC §10 D1 — RE-RESOLVED 2026-08-15 on gn100-2f74, by the same block-0 rule.
  # Nemotron Nano 12B v2 VL (NVFP4), measured warm on this box: 1 image 2.0 s,
  # 5 images 3.0 s — inside the 4 s live cap. Cold first call is ~26 s; warm it before
  # judging latency. finish_reason=stop with no reasoning spill, unprompted.
  # Server limits that bind us (its launch flags, raised by us 2026-08-15 in
  # /etc/systemd/system/gn100-vlm.service, backup at /root/gn100-vlm.service.bak):
  # 40960 ctx, max 16 images @<=1920x1080, max-num-seqs 1. ~780 prompt tokens per
  # 512px frame; native 1080p frames cost several times that — budget before raising
  # deep.sample_fps. NOTE: the VL container joins nemoclaw-vllm's network namespace,
  # so restarting nemoclaw-vllm kills the VL server's networking too.
  model: nvidia/NVIDIA-Nemotron-Nano-12B-v2-VL-NVFP4-QAD
  precision: bf16                # quantized Cosmos Reason variants hallucinate

  # Fallback HTTP timeout. Per-profile values below take precedence. Something must be
  # set: max_inflight is 1, so a wedged endpoint with no timeout holds the only slot
  # forever and hangs BOTH surfaces at once.
  request_timeout_seconds: 120

  prompts:
    # Caption text lives here so M1 and the rollup job cannot drift to different
    # prompts and quietly produce two incomparable caption styles in one index.
    # Measured on 1,149 live captions before this wording: 98% of them described the
    # burned-in clock, spending a median 10 of 42 words — a QUARTER of the budget — on
    # narrating our own overlay, while only 25% mentioned an action at all. The overlay
    # exists so the MODEL can read it for temporal localization (invariant 8); the index
    # already stores exact t_start/t_end, so citing it back is pure waste. The old line
    # "If a timestamp is burned into the frame, cite it" is what caused it.
    #
    # Raising max_tokens was the alternative and is the worse trade: decode is ~95% of
    # cost (SPEC §2.4), so 80 -> 160 tokens roughly doubles caption latency and halves
    # the headroom the deep worker shares. Recovering the wasted quarter is free.
    caption: >-
      Describe this moment in four to six sentences. Be specific and concrete — this
      text is the ONLY record of the moment once the window closes, and a later search
      has nothing else to match on.
      (1) The people: how many, and for EACH of them what they are doing, what they are
      holding or touching, and where they are looking.
      (2) What they are wearing: colours and distinctive items.
      (3) The objects and surroundings that matter — furniture, screens, doors,
      vehicles — and where people are relative to them.
      (4) What CHANGES across the frames: who moves, what enters or leaves, what is
      picked up or put down. Say explicitly if nothing moves.
      No preamble: do not open with "This image", "The scene shows" or "appears to be".
      Do NOT describe or quote the timestamp burned into the frame.
      Report only what is visible; do not speculate about intent or identity.

    # Appended to `caption` above when standing tasks are active — see
    # services/ingest/watchlist.py for why. Short story: M5 stage 1 is a cosine against
    # the caption and stage 2 re-reads the caption, so neither ever sees a pixel. A
    # detail the caption omits is a task that can never fire. Rather than hope a general
    # caption mentions the right noun, ask for it.
    #
    # The last line is load-bearing. Naming a thing to look for biases the model toward
    # reporting it; "only if you can actually see it" plus stage 2's re-read and stage 3's
    # 4 fps re-watch are what keep that from becoming a false alert. Deleting that line
    # turns the checklist into a suggestion box.
    #
    # Costs prefill, not decode. SPEC §2.5: prefill ~5% of per-chunk cost, so this does
    # not touch the 320-token output budget below.
    watchlist_preamble: >-
      Then add a final line starting "WATCHING:" that states, for each item below,
      whether it is present in these frames. Name the item and answer present or absent.
      Say present ONLY if you can actually see it — a guess here triggers a real alert.
      Items:

    deep: >-
      Watch this footage closely and answer the question. Cite the burned-in
      timestamps for anything you report. If the footage does not show enough
      to answer, say so explicitly rather than guessing.

  profiles:
    live:
      enable_reasoning: false    # a CoT caption is 1000+ tokens -> 60 s+/chunk
      # Raised from 80 on 2026-08-15, deliberately and with measurements — see
      # CLAUDE.md invariant 6, which this supersedes for THIS model. Measured on real
      # 1080p webcam frames, four identical windows:
      #
      #   cap   latency   tokens produced   truncated
      #    80    0.77 s        65             0/4      <- the cap was not the limit
      #   160    0.66 s        65             0/4
      #   320    2.51 s       124             0/4      <- with the fuller prompt below
      #
      # The cap alone changes nothing: the model stops when the PROMPT is satisfied.
      # What costs latency is asking for more, and that cost is affordable here —
      # 2.51 s per captioned window against a 4 s stride, and the detector gate skips
      # ~78%, so the effective load is 0.55 s per stride (14% duty cycle).
      #
      # If the gate's skip rate ever falls below ~40%, this is the first number to put
      # back: at 2.5 s a caption, real-time needs most windows to be skipped.
      #
      # PUT BACK 2026-08-16, exactly as that line anticipated. Measured on gn100-2f74
      # with the camera pointed at an occupied room: the gate skipped **30%** of 418
      # judged windows, not the ~78% every budget here assumes — a room with people
      # working in it has motion in almost every window, so the gate is behaving
      # correctly and simply has nothing to throw away. The result was 6.6 s of work per
      # window against a 4 s stride: 0.61x real time, ingest 35 minutes behind the
      # camera and losing 27 s per minute of footage. It never recovers on its own.
      #
      # The VLM is also no longer serving captions alone: M5's stage-3 verification and
      # the ask surface's now-automatic escalation each take the single slot for 17-30 s
      # (see agent.search.confirm_before_widening).
      #
      # 160 was still not enough. Measured immediately after, on this camera's footage:
      # the model wrote 134-141 tokens either way and a caption took 6.85 s with the GPU
      # to itself and 14.8 s with M3/M5 running — decode floor 19.6 tok/s against the
      # 31 tok/s DEPLOY_GN100.md measured, which is the contention, not the model.
      # Frame sampling is NOT the problem: 376 ms in steady state (the 3.1 s the bench
      # reports includes a one-off overlay font measurement).
      #
      # 96 caps decode at ~3 s at the uncontended rate, which is what a 4 s stride can
      # actually afford once the gate stops skipping. Captions get terser; that is the
      # trade being made, deliberately, to keep the index current with the camera. A
      # caption that arrives 15 minutes late describes footage nobody can ask about.
      max_tokens: 96
      temperature: 0.0
      request_timeout_seconds: 30   # expected ~2 s. Anything near this is pathological.
    deep:
      enable_reasoning: true
      max_tokens: 600            # ~35 s of decode at 17 tok/s. Do not raise casually.
      temperature: 0.0
      # gn100-2f74: sized to the VL server's 16-image cap, not to taste. Max deep range
      # is 25 s + 2x5 s pad = 35 s; 0.4 fps x 35 s = 14 frames <= 16. The frames are
      # native 1080p (invariant 7), so each carries far more detail than a live frame —
      # the tradeoff is temporal density, which the burned clock partly buys back.
      sample_fps: 0.4
      native_resolution: true
      # Deliberately longer than the 90 s job timeout the user is shown (SPEC §4.3), so
      # that the job-level timeout fires first with a sentence instead of the transport
      # dying with a stack trace.
      request_timeout_seconds: 120

  queue:
    # SPEC §7 priority order. Ingest may be paused, never starved — M5 has nothing to
    # match against if captions stop arriving.
    priorities: [interactive, verification, ingest]
    max_ingest_pause_seconds: 5
    max_inflight: 1              # one camera = one request in flight; batching is moot

# --------------------------------------------------------------------------------------
# Index — SPEC §3.2 / §3.4
# --------------------------------------------------------------------------------------
index:
  store:
    # `memory` runs with no Milvus and no NGC key, so M3 can be built against a working
    # retrieval pipeline today. Flip to `milvus` once the container is up.
    backend: memory              # memory | milvus
    # REQUIRED for a multi-process run, not optional. M1, M3 and M5 are separate
    # processes; with this null each gets its own empty in-memory corpus, ingest's
    # captions die with the ingest process, and every question retrieves nothing —
    # which the groundedness gate then correctly reports as "not answerable".
    # Flipping index.store.backend to `milvus` makes this moot.
    memory_path: data/index.jsonl
  milvus:
    host: localhost
    port: 19530
    collection: chunks
    index_type: AUTOINDEX
    metric_type: COSINE
    live_partition: captioned    # gated nulls live in their own partition, see below
    gated_partition: gated
  embed:
    backend: hashing             # hashing | nim
    model: llama-3.2-nemoretriever-300m-embed-v1
    dims: 768                    # Matryoshka-truncated
    endpoint: http://localhost:8001/v1
    path: /embeddings
    timeout_seconds: 30
    # nemoretriever is asymmetric — queries and passages use different input types.
    # Swapping these quietly costs recall rather than failing, so they are explicit.
    query_input_type: query
    passage_input_type: passage
  rerank:
    backend: lexical             # lexical | nim
    model: llama-3.2-nv-rerankqa-1b-v2
    endpoint: http://localhost:8002/v1
    path: /ranking               # NIM rerank is NOT an OpenAI-shaped route
    timeout_seconds: 30
  search:
    # 60, not 20, since 2026-08-16. The recency blend below can only reorder what ANN
    # hands it, and 20 candidates chosen by hashing-embedding similarity across a 30 min
    # window are spread over the whole window: at ann_k=20 the top 5 for "what is
    # happening right now" still straddled 3.5 minutes and pulled in an unrelated scene,
    # at 60 they land inside 80 s of each other. The reranker is lexical and stdlib, so
    # 60 short passages costs microseconds; revisit if index.rerank.backend goes to nim,
    # where every candidate is a passage over the wire.
    ann_k: 60
    rerank_top_n: 5
    # Recency preference, applied AFTER the reranker scores (SPEC §3.4).
    #
    # The lexical reranker scores term overlap and nothing else, so within the lookback
    # window it has no opinion about time: measured 2026-08-16, "what is happening in the
    # room right now" ranked a caption 29 minutes old first, while captions from 5 minutes
    # ago sat at rank 1 and below. agent.search.default_lookback_seconds was already
    # narrowed to 30 min for this reason; it bounds the candidate set but cannot order it.
    #
    # `recency_weight` is the share of the final score that comes from age, on a 0..1
    # scale after both terms are min-max normalised over the candidate set. 0 disables
    # this entirely and restores pure rerank order.
    #
    # Age is measured against the NEWEST CANDIDATE, not wall clock. A question about an
    # explicit past range would otherwise have every candidate scored as equally ancient,
    # which is a dial that does nothing; relative recency inside the range is the useful
    # signal in both cases.
    # 0.6 measured, not guessed: at 0.35 the volleyball-court caption from 25 minutes ago
    # still outranked ATM captions from 3 minutes ago on lexical overlap alone. 0.6 and
    # 0.75 produce the identical top 5, so 0.6 is the lower edge of the plateau — far
    # enough from the cliff to be stable, close enough that a strongly-relevant older
    # caption can still win (one does, in the "right now" case at ann_k=20).
    recency_weight: 0.6
    recency_half_life_seconds: 300   # 5 min: a caption twice this old contributes a
                                     # quarter of the recency term, not zero
  browse:
    # Listing the index in time order (the /browse page), not retrieval. Milvus has no
    # ORDER BY on `query`, so ordering means scanning the matching scalars and sorting
    # client-side; this is that scan's batch size. Two scalars per row, so a large batch
    # is cheap — but it is bounded so a day of windows does not arrive as one response.
    # The in-memory backend ignores it: it already holds every record.
    scan_batch: 1000
  rollup:
    enabled: false               # stretch goal — SPEC §10 D4
    window_seconds: 60

# --------------------------------------------------------------------------------------
# Ask agent — SPEC §4
# --------------------------------------------------------------------------------------
agent:
  # SPEC §10 D3 — RE-RESOLVED 2026-08-15 on gn100-2f74: Nemotron 3.5 Lightning, the
  # variant SPEC named, served by the box's own `nemoclaw-vllm` container. This restores
  # SPEC §7's two-process design; invariant 1 still holds because BOTH model processes
  # are externally managed — we start zero.
  model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
  backend: nim                   # stub | nim (OpenAI-compatible; vLLM speaks it)
  endpoint: http://localhost:8000/v1   # the box's Lightning vLLM, not ours to spawn
  # Merged verbatim into every chat-completion body. Load-bearing, measured 2026-08-15:
  # Lightning is a hybrid reasoner and WITHOUT this it writes "Here's a thinking
  # process:" into `content` itself — 466 tokens of it — so the groundedness gate's
  # YES/NO first-line parse breaks. This is invariant 6's failure mode on the ask path,
  # and per-request kwargs are the only switch vLLM offers at runtime (the /no_think
  # and "detailed thinking off" system prompts were both tested and do nothing).
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
  max_tokens: 512
  # Which of the two model sources the console's topbar selector starts on:
  #   default  -> agent.backend/endpoint/model above, i.e. `make serve`'s llama-server
  #   lmstudio -> whatever model LM Studio currently has loaded (see the block at the
  #               bottom of this file)
  # The selector rebinds the ASK surface only. M1's captioner runs in the ingest process
  # and keeps talking to vlm.endpoint whatever this says — a web page cannot reach into
  # another process, and pretending otherwise would put the two surfaces on different
  # models without saying so.
  model_source: default          # default | lmstudio
  host: 0.0.0.0
  port: 8080
  groundedness_gate: true        # SPEC §4.2 — retrieval distance is NOT confidence
  request_timeout_seconds: 30
  temperature: 0.0
  ui_dir: ui
  search:
    # The ask surface is asked about NOW. Answering from the whole day lets a caption
    # from hours ago outrank the last few minutes on a lexical tie, and the answer looks
    # confidently wrong rather than absent — the user asks "what is happening" and gets
    # this morning.
    default_lookback_seconds: 1800        # 30 minutes
    # Used only after the user says yes to looking further back. Widening is offered,
    # never assumed: re-watching an hour of footage is the expensive path (SPEC §5), and
    # a system that silently reaches for it turns "I don't know" into a 90 s wait.
    extended_lookback_seconds: 86400      # 24 hours
    # Ask before widening, or act.
    #
    # FALSE on gn100-2f74, deliberately: an unanswerable question searches the extended
    # window and escalates to the deep worker on its own, with no click. The system is
    # meant to be autonomous — the demo's whole claim is that it KNOWS when its own
    # summary is not good enough and goes back to the footage. A confirmation prompt puts
    # a human in the middle of exactly the moment that claim is being made.
    #
    # The cost is real and is the reason `true` exists: a misread question spends tens of
    # seconds of the single VLM slot re-watching footage nobody asked about, and turns
    # "I don't know" into a wait. That is a price worth paying here — invariant 4 keeps
    # the turn itself unblocked (the provisional answer returns immediately and the
    # refinement is appended when it lands), so the cost is VLM time, never a frozen UI.
    confirm_before_widening: false
  chunks:
    lookback_seconds: 3600
    max: 500
  browse:
    # The index browser (ui/browse.html) — paging the captions the system wrote, in
    # wall-clock order. Not retrieval: no query, no rerank, no top-n.
    page_size: 25                # rows per page when the client does not ask
    max_page_size: 200           # a client asking for more gets this; the caption column
                                 # is the payload and 200 rows is already ~60 KB of text
    caption_preview_chars: 240   # where the row's caption is clipped before "more" —
                                 # long enough for a live caption (80 tokens), short
                                 # enough that a deep one (~600) does not own the page
  actions:
    lookback_seconds: 86400
  history:
    max_turns: 200               # how many turns GET /api/chat/history replays to the page

    # How many PRIOR turns the model sees. Without this every turn is independent, and a
    # follow-up — "what were they wearing?" after "is anyone at the door?" — has no idea
    # who "they" is: it re-retrieves from scratch against a pronoun and answers whatever
    # the ANN happens to return.
    #
    # Small on purpose. Prior turns are prefill on EVERY call, and there are two calls a
    # turn (gate + answer). 3 turns of question plus a clipped answer is roughly 400-600
    # tokens; going to 10 would cost more prefill than the 5 retrieved captions do.
    # 0 disables it and restores the old stateless behaviour.
    context_turns: 3

    # Prior answers are clipped to this before going in. An answer can be 512 tokens and
    # the useful part for resolving a reference is the first sentence or two — carrying
    # all of it crowds out the captions, which are the actual evidence.
    context_answer_chars: 400
  ws:
    ping_interval_seconds: 25.0  # a silent WebSocket dies to an idle proxy; this keeps
                                 # the refinement channel open across a 90 s deep job
  prompts:
    # SPEC §4.2's gate, in words. The model is told what captions DO and DO NOT record,
    # because the whole decision turns on that distinction.
    # SPEC §4.2's gate, in words. The model is told what captions DO and DO NOT record,
    # because the whole decision turns on that distinction.
    #
    # REWRITTEN 2026-08-16, measured. The previous wording said "YES means: everything the
    # question asks for is stated in the context", and it escalated 15 of 16 real turns —
    # including "how many people are in the room?" against a caption reading "Two people
    # are visible in the scene". The model read "everything ... is stated" as demanding an
    # aggregate no per-window caption can ever contain, and refused: "they do not provide a
    # single total count for the room across all footage". Leading with the list of what
    # captions omit made it worse by priming the search for a reason to say NO.
    #
    # The gate's job is to catch questions needing detail the captions cannot hold, NOT to
    # demand certainty. An over-strict gate is expensive in exactly the way SPEC §4.2 warns
    # about: every question spends the single VLM slot re-watching footage, and the badge
    # that is supposed to mean something says "not answerable" on every turn.
    groundedness: |
      You are checking whether a question can be answered from retrieved video captions ALONE.
      The captions were written by a vision model at 1 fps from downscaled frames. Each describes one short window, so the context is a sample of moments, never a complete record of the room.
      Answer with YES or NO on the first line, then one short sentence saying why.
      YES means: the captions support a reasonable answer, even a partial or approximate one. A count, an activity, a description or a presence stated in any caption IS an answer. Judge what the captions DO say, not what they leave out.
      NO means: answering needs detail the captions do not record — text on a sign or screen, the state of a door, a colour read off a small surface, a face, a licence plate — or the captions simply do not mention the subject of the question at all.
      The captions come from one fixed camera and are listed with their wall-clock times. The NEWEST caption describes the scene as it is now, so a question about the present is answered by it.
      Do not demand a single caption that covers the whole question, do not require certainty, and do not require a simultaneous census of the scene: if a caption says how many people are visible, that answers "how many people".
      Do not answer the question itself.
    # "Two or three sentences. No preamble." was not enough. `--reasoning off` stops
    # this model emitting reasoning_content, but it is still a thinking model — so the
    # thinking RELOCATES into the answer, and the user gets "The user is asking if any
    # person was raising a hand. I need to examine the five captions... 1. ... 2. ..."
    # truncated mid-list by max_tokens. Naming the specific failures is what stopped it;
    # measured 2 leaks in 3 questions before, 0 after.
    answer: |
      You answer questions about recorded video using retrieved captions.
      Cite the wall-clock times of what you report, and label them UTC — the captions' timestamps are UTC.
      The captions come from one fixed camera. The NEWEST one describes the scene as it is now, so answer a question about the present from it rather than calling it a stale snapshot.
      State plainly when the captions do not record what was asked rather than guessing; a request_deep_analysis call is the correct response to fine visual detail — text on a sign or screen, the state of a door, a colour read off a small surface, a face, a plate — and the wrong response to a question the captions already describe.
      Answer the question in your FIRST sentence. Never restate the question, never narrate what you are about to do, and never list the captions back — the user can already see them.
      Two or three sentences. No preamble, no numbered lists.

  stub:
    # Fraction of the question's content words that must appear in the retrieved
    # captions before the stub gate calls a question answerable. Only the stub backend
    # reads this. Note the gate ALSO refuses outright when the question turns on a
    # visual detail term the captions never mention, regardless of this score —
    # lexical overlap measures vocabulary, not whether the answer is present.
    coverage_threshold: 0.6
  deep:
    timeout_seconds: 90          # stated to the user, SPEC §4.3
    max_inflight: 1
    dedupe_identical_ranges: true
    # SPEC §5 warned that the CoT blows the budget. On this model it is the PREFILL that
    # blows first, and measurably so: a native-resolution 1080p frame costs ~261 prompt
    # tokens through the vision encoder, so 4 fps fills a 32k context in ~30 s of
    # footage. 60 s (240 frames, ~64k tokens) returns HTTP 400 from llama-server, which
    # reaches the UI as a deep job that never completes.
    #
    # 25 s -> 100 frames -> ~26k tokens, inside 32k with room for the answer, and still
    # within SPEC §5's 20-60 s realistic target. Raise `SPARK_CTX` in
    # scripts/serve_models.sh before raising this. A longer range is REFUSED with the
    # numbers in the message rather than silently truncated.
    # 25 -> 15 s. The deep path and the live captioner share ONE model (invariant 1), so
    # every second a re-watch holds the slot is a second ingest falls behind the camera.
    # Measured 2026-08-16: three escalations in five minutes took the lag from 49 s to
    # 173 s. Fifteen seconds of footage at 0.4 fps is still 6 frames at native 1080p —
    # enough to answer "what was on the whiteboard", which is what the deep path is for.
    max_range_seconds: 15.0
    # Padding either side of the cited chunks: a 5 s window that clipped the event at
    # its boundary is precisely the case being escalated.
    range_pad_seconds: 5.0
    # With no hits at all there is nothing to cite, so the worker re-watches the most
    # recent stretch and says so. Kept <= max_range_seconds: a larger value would be
    # silently clamped on every no-hit escalation, which is a dial that does nothing.
    fallback_window_seconds: 25.0
    poll_interval_seconds: 0.25
    decode_timeout_seconds: 30.0
    frame_quality: 2             # ffmpeg -q:v for sampled frames; 2 is near-lossless
    # Multiplier applied when the answer admits it could not see enough. Confidence
    # here means COVERAGE, not certainty — see services/worker/analysis.py.
    hedged_confidence_factor: 0.35
    job_history: 256             # completed jobs retained for /api/chat/history replay

# --------------------------------------------------------------------------------------
# MCP actions — the outside world (SPEC §6.4)
# --------------------------------------------------------------------------------------
mcp:
  # `notify_discord` posts to a Discord channel through AlertBridge, a separate service
  # on this host that owns the webhook and its credentials. This repo holds no webhook
  # URL, no Discord library and no token — see services/mcp/alertbridge.py.
  #
  # It is the only action with an effect off this box, which is exactly why it sits
  # behind the same three brakes as every other one: a posted message cannot be
  # un-posted, and SPEC §6.4's failure mode — thirty alerts for one event — is far worse
  # when it has an audience.
  discord:
    base_url: http://100.127.233.98:8081   # Tailscale; authorized tailnet devices only
    # The token comes from the environment, never from here and never from the repo:
    #     export ALERTBRIDGE_SERVICE_TOKEN=...
    # A task configured to notify Discord with no token fails LOUDLY at startup rather
    # than silently notifying nobody — a task that looks armed and is not is the worst
    # of both worlds.
    username: Spark Vision              # <= 80 chars, shown as the poster in Discord
    timeout_seconds: 5.0                # the send runs inside the action-log lock, so
                                        # this bounds how long a slow AlertBridge can
                                        # hold up M3 and M5. Short on purpose.
    max_text_chars: 1900                # AlertBridge's own cap is 2000
    # What the channel sees. Times are UTC and explicit because the reader is not on this
    # box and has no idea what local means here.
    text_template: |
      🎥 **{task_id}** — {camera_id}
      {reason}
      Footage: {t_start} → {t_end} ({seconds}s)

# --------------------------------------------------------------------------------------
# Monitor — SPEC §6
# --------------------------------------------------------------------------------------
monitor:
  tasks_file: config/tasks.yaml
  # Deliberately loose — over-trigger here, filter later (SPEC §6.2). 0.35 was NOT loose
  # against `index.embed.backend: hashing`, which is bag-of-words: it scores literal word
  # overlap diluted by caption length, so "a red band is visible on the wrist" scored
  # 0.18 against a task describing exactly that, and "red wristbands" scored 0.07 because
  # `wristband` and `band` are simply different tokens. Measured over 600 captioned
  # windows of real footage, describe "a person wearing a red wristband":
  #   0.35 -> caught 1 of 23 true events, 0 false positives
  #   0.20 -> caught 9 of 23,             0 false positives
  #   0.15 -> caught 12 of 23,            4 of 577 (1%) false positives
  #   0.10 -> caught 14 of 23,           50 of 577 (9%) false positives
  # 0.15 buys half the recall for 1% leakage, which is precisely what stage 2's LLM is
  # there to reject. RAISE THIS BACK toward 0.35 if `embed.backend` ever becomes `nim` —
  # a real semantic embedder separates these classes far better and this would be slack.
  stage1_cosine_threshold: 0.15
  stage2_sustain_default: 120
  default_cooldown_seconds: 300
  dedupe_overlap_seconds: 5      # consecutive chunks share 1 s and double-report
  verify_promoted: true          # stage 3 attaches; it is NOT a blocking precondition

  # Stage 2 — LLM confirm. Deliberately reads `agent.backend` rather than a key of its
  # own, so M3 and M5 can never end up talking to different models.
  confirm_path: /chat/completions   # NIM has moved this route between releases
  # Stage 2's prompt. Measured against three captions — a match, an empty scene and an
  # unrelated one — because a prompt that only ever says "yes" is worse than no stage 2
  # at all. The earlier wording ("Answer no if the description does not clearly show the
  # task") answered NO to a caption that literally restated the task, so nothing could
  # ever promote. Telling the model to judge MEANING and giving it one worked example of
  # a synonym is what fixed it.
  confirm_prompt: >-
    Decide whether the SCENE satisfies the CONDITION. Wording will differ — judge the
    meaning, not the words. A 'van' is a vehicle, a 'person' is someone.
    Answer with one word: YES or NO.
  confirm_timeout_seconds: 30.0
  confirm_max_tokens: 8             # stage 2 answers one word — invariant 6 in spirit
  stage2_stub_min_overlap: 0.5      # StubConfirmer only; no effect on the real path

  # Stage 3 — worker verify. Below the threshold the provisional action is RETRACTED;
  # an ABSENT confidence is inconclusive and leaves the action standing, because
  # "the worker could not tell" is not the same as "the worker disagreed".
  verify_confidence_threshold: 0.5
  verify_question_template: >-
    Does this footage show: {describe}? Answer yes or no, cite the burned-in
    timestamps for anything you report, and say so explicitly if the footage does
    not show enough to decide.

# --------------------------------------------------------------------------------------
# UI — SPEC §11
# --------------------------------------------------------------------------------------
ui:
  display_timezone: America/Los_Angeles # the ONLY place local time is allowed (SPEC §11.5)
  time_format: "%H:%M:%S"
  poll_interval_ms: 1000
  # SPEC §11.1 / CLAUDE.md invariant 10 — the demo runs with the network off.
  vendored_assets_only: true

# --------------------------------------------------------------------------------------
# LM Studio — the OTHER model source the console's topbar selector can switch M3 onto.
# --------------------------------------------------------------------------------------
# `make serve` starts our own llama-server on 8000 using the CUDA-13 ARM64 binary that
# LM Studio ships. This block is for the opposite arrangement: LM Studio is already
# running with a model loaded, and we borrow it. That is the cheap way to A/B a candidate
# model — load it in the GUI, pick "LM Studio" in the topbar, ask the same question twice
# — with no second copy in our model dir.
#
# It does NOT relax invariant 1. Selecting LM Studio changes which endpoint M3 talks to;
# it cannot stop the server `make serve` started. If both are up, both are resident and
# both are eating the 128 GB budget — /api/model reports that and the topbar says so.
lmstudio:
  endpoint: http://localhost:1234/v1    # LM Studio's default local-server port

  # null = use whatever model is loaded, which is the point of this option: no filename
  # to keep in sync with the GUI. Pin an id here to require a specific one.
  model: null

  # The ask surface is text-only, so a text model is fine here. Set true if you ever
  # point the CAPTIONER at LM Studio — without a vision projector it fails on frame one.
  require_vision: false

  # A 1080p frame costs ~261 prompt tokens, so the deep path's 25 s at 4 fps is ~26k.
  # LM Studio loads whatever its GUI slider says; below this a deep request returns
  # HTTP 400, which reaches the UI as a job that never completes (see agent.deep).
  min_context_tokens: 32768

  resolve_timeout_seconds: 5            # one GET against localhost; the UI waits on it

  # `--reasoning off --reasoning-budget 0` is a LAUNCH flag, and we are not the launcher.
  # gemma-4 is a thinking model: left on it spends the whole budget inside
  # reasoning_content and returns an EMPTY answer with finish_reason=length. These fields
  # are merged into every request body to make the same switch per-request. Which spelling
  # a given llama.cpp/LM Studio build honours is a build detail, so send both and keep
  # them here rather than in code — an unknown field is ignored, a missing one is not.
  reasoning_off_payload:
    reasoning_format: none
    chat_template_kwargs:
      enable_thinking: false

# --------------------------------------------------------------------------------------
# Doctor — `make doctor` checks this box against the CLAUDE.md machine-state table.
# --------------------------------------------------------------------------------------
doctor:
  expected_arch: aarch64
  expected_compute_capability: "12.1"   # sm_121. NOT sm_100 (datacenter Blackwell),
                                        # NOT sm_120 (RTX 50xx). Wheels lie about this.
  min_unified_memory_gb: 120
  min_free_disk_gb: 100
  archive_gb_per_day: 43                # 1080p @ 4 Mbps — used to report days of runway
  min_python: [3, 11]                   # [major, minor], compared as a list
  # Local model runners hold unified memory and violate invariant 1's budget. Warn, do
  # not fail: the user may be mid-shutdown.
  model_runner_names: [lm-studio, lmstudio, unsloth, ollama, vllm]
  model_runner_ports: [8888, 1234]      # 1234 is LM Studio's default server port

# --------------------------------------------------------------------------------------
# Logging — CLAUDE.md conventions. We cannot tune what we cannot see.
# --------------------------------------------------------------------------------------
logging:
  level: INFO
  format: json
  vlm_calls:                     # every VLM call logs all of these
    - model
    - profile
    - prompt_tokens
    - completion_tokens
    - wall_time_ms
